[project]
name = "host-firewall"
version = "0.2.1"
description = "Host UFW panel with labeled rules and confirm-or-rollback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Reon Smith" }]
keywords = ["ufw", "firewall", "ubuntu", "homelab", "fastapi"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/reonsmith/host-firewall"
Issues = "https://github.com/reonsmith/host-firewall/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["templates/*", "static/*"]
