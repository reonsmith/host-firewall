{% extends "base.html" %}
{% block title %}Login — Host Firewall{% endblock %}
{% block content %}
<div class="login-shell">
  <section class="card narrow login-card">
    <p class="eyebrow">Host UFW console</p>
    <h1>Sign in</h1>
    <p class="muted">{{ label }}</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="stack">
      <label>Password
        <input type="password" name="password" required autofocus minlength="12" autocomplete="current-password" />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="muted tiny">Changes use a confirm-or-rollback window so a bad edit can undo itself.</p>
  </section>
</div>
{% endblock %}
