{% extends "base.html" %}
{% block title %}Sign in — Host Firewall{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<div class="login-shell">
  <section class="panel login-card">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Sign in</h1>
    <p class="host">{{ label }}</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="stack">
      <label>Password
        <input type="password" name="password" required autofocus minlength="12" autocomplete="current-password" />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="muted tiny login-foot">Every change opens a confirm window. If you lose access, it rolls itself back.</p>
  </section>
</div>
{% endblock %}
