name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t host-firewall:ci .
      - name: Smoke test demo mode
        run: |
          docker run -d --name hf -p 8080:8080 -e HOST_FIREWALL_DEMO=1 host-firewall:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          docker logs hf
          exit 1
